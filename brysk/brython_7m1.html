<script type="text/javascript">
//alert('JS loading...');

function betterTab(cm) {
  //this function replaces tab with 4 spaces ... in CodeMirror
  //https://github.com/codemirror/CodeMirror/issues/988
  if (cm.somethingSelected()) {
    cm.indentSelection("add");
  } else {
    cm.replaceSelection(cm.getOption("indentWithTabs")? "\t":
      Array(cm.getOption("indentUnit") + 1).join(" "), "end", "+input");
  }
}
function CM(){
  //actually sets up CodeMirror on the page
  var t_codeskulptor_commentblock = function(e) {
            var t = e.getCursor(true);
            var r = e.getCursor(false);
            var o = t.line;
            var i = r.line;
            if (r.ch === 0) {
                i -= 1
            } else {
                r.ch += 1
            }
            e.operation(function() {
                for (var n = o; n <= i; n++) {
                    var a = e.getLine(n);
                    e.replaceRange("#" + a, {
                        line: n,
                        ch: 0
                    }, {
                        line: n
                    })
                }
                e.setSelection(t, r)
            })
        };
  var r_codeskulptor_uncommentblock = function(e) {
            var t = e.getCursor(true);
            var r = e.getCursor(false);
            var o = t.line;
            var i = r.line;
            if (r.ch === 0) {
                i -= 1
            }
            var n = /^(\s*)\#/;
            e.operation(function() {
                var a, s;
                for (var u = o; u <= i; u++) {
                    a = e.getLine(u);
                    s = a.replace(n, "$1");
                    if (a !== s) {
                        e.replaceRange(s, {
                            line: u,
                            ch: 0
                        }, {
                            line: u
                        })
                    }
                }
                if (a !== s && r.ch !== 0) {
                    r.ch -= 1
                }
                e.setSelection(t, r)
            })
        };
  var myCodeMirror = CodeMirror.fromTextArea(document.getElementById("code"),{
    indentUnit:4,
    lineNumbers:true,
    extraKeys:{
        Tab:betterTab,
        "Ctrl-K":t_codeskulptor_commentblock,
        "Shift-Ctrl-K": r_codeskulptor_uncommentblock,
        "Ctrl-F": function(cm) {
          CodeMirror.commands.find(cm);
        }
    },
    //foldGutter: {
    //  rangeFinder: new CodeMirror.fold.combine(CodeMirror.fold.indent)
    //},
    foldGutter: true,
    //gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
    matchBrackets:true,
    //gutters: ["fold-gutter"],
    //gutters: ["CodeMirror-foldgutter"],
    gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
    fixedGutter: false,
    mode: {
        name: "python",
        version: 3,
        singleLineStringErrors: false
    }
    
  });
  window.myCodeMirror = myCodeMirror;
  
  //catch a codeskulptor filename hash, fetch that file, and put it in the textarea
  if(window.location.hash) {

    function fetchit(jQuery){
      try {
        a = jQuery;
      }
      catch(e){
        setTimeout(fetchit,1000);
        errors.innerHTML += "jQuery is undefined ...<br>"
        return
      }

      var hash = window.location.hash.substring(1); //Puts hash in variable, removes # char

      //using YQL:
      //cds = "http://codeskulptor-"+bucket+".commondatastorage.googleapis.com/"+hash;
      //yql = 'https://query.yahooapis.com/v1/public/yql?q=select%20*%20from%20html%20where%20url%3D%22'+escape(cds)+'%22';
      //yql = 'https://query.yahooapis.com/v1/public/yql?env=store%3A%2F%2Fdatatables.org%2Falltableswithkeys&q=select%20*%20from%20data.headers%20where%20url%3D%22'+escape(cds)+'%22';

      //using crossorigin.me
      //cds = "codeskulptor-"+bucket+".commondatastorage.googleapis.com/"+hash;
      //yql = 'http://crossorigin.me/http://' + escape(cds);

      //reading the hash from reaktix instead
      yql = "cs/keepitforme.api.php?key=" + escape(hash);

      //log the request url to the console, in case something breaks ...
      console.log(yql);

      jQuery.get(yql,function(r){

        myCodeMirror.doc.setValue(unescape(r));

      }).fail(function(){alert("File "+hash+" could not be found.");window.location.hash='';});
    }
    fetchit($);
  }
}
function setup(){
  //define stdout and stderr objects and methods
    __BRYTHON__.stdout={write:function(x){myconsole.innerHTML+=x.replace(/[<]/g,"&lt;");},
                        writeHTML:function(x){myconsole.innerHTML+=x;},
                        clear:function(){myconsole.innerHTML='';}
                       };
    __BRYTHON__.stderr={write:function(x){errors.innerHTML+=x.replace(/[<]/g,"&lt;");},
                        writeHTML:function(x){errors.innerHTML+=x;},
                        clear:function(){errors.innerHTML='';}
                       };

    //EXPERIMENTAL
    //make Codeskulptor's simplegui accessible from Brython
    //__BRYTHON__.VFS.simplegui = [".js",Sk.builtinFiles.files['src/lib/simplegui/__init__.js']+";var $module=$builtinmodule;"];
    //__BRYTHON__.VFS.simpleplot = [".js",Sk.builtinFiles.files['src/lib/simpleplot/__init__.js']+";var $module=$builtinmodule;"];
    
  //define a custom javascript Brython module
    __BRYTHON__.VFS.testmodule = [".js", (function(){/*
    var $module=(function($B){

        var mod = {
            //dis:function(src){
            //    $B.$py_module_path['__main__'] = $B.brython_path
            //    return __BRYTHON__.py2js(src,'__main__','__main__','__builtins__').to_js()
            //}
        }
        return mod;

    })(__BRYTHON__)*/}).toString().slice(14,-3)];    
    
}
  
function savecode_pre(){
  if(window.location.hash) {
      var hash = window.location.hash.substring(1); //Puts hash in variable, removes # char
    //console.log('orighash:'+hash);
    savecode_mid(hash);
  } else {
    url = 'cs/keepitforme.api.php';
    //console.log('url:'+url);
    $.get(url,function(r){savecode_mid(r)});
  }
}
function savecode_mid(filename){
  console.log('savecode_mid:'+filename);
  pieces = filename.split("_");
  if (pieces.length==1){
    //we don't have a version number yet ... so add -1 as the version
    pieces.push("-1");
  }
  pieces[1] = Number(pieces[1]) + 1;
  newfilename = pieces.join("_");
  console.log('savecode_mid:'+newfilename);
  url = 'cs/keepitforme.api.php';
  //url2 = url + '&item=' + escape(myCodeMirror.doc.getValue())
  $.post(url,{key:newfilename, item:escape(myCodeMirror.doc.getValue())},function(r){savecode_post(r,newfilename)});
}
function savecode_post(response,nfn){
  window.location.hash = nfn;
  window.YQLResponseSAve = response;
}
